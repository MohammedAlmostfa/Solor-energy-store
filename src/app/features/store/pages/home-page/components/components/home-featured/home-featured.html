
<section class="featured-section" id="featured-products">
  <div class="section-heading">
    <div>
      <span class="section-eyebrow">اختياراتنا لك</span>
      <h2>منتجات مميزة</h2>
      <p>اكتشف مجموعة مختارة من منتجات الطاقة الشمسية.</p>
    </div>

    <a routerLink="/products" class="section-link">
      جميع المنتجات
      <span aria-hidden="true">←</span>
    </a>
  </div>

 @if (cartFeedback(); as message) {
  <p class="cart-feedback" role="status">
    {{ message }}
  </p>
}

  @if (products().length > 0) {
<app-products-grid
  [products]="products()"
  [categoryLabels]="categoryLabels()"
  (addToCart)="productAdded.emit($event)"
/>
  } @else {
    <div class="empty-products">
      <p>لا توجد منتجات متاحة حالياً.</p>

      <a routerLink="/products" class="button button-primary">
        تصفح المنتجات
      </a>
    </div>
  }
</section>
