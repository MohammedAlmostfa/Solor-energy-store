
<section class="products-page container">
  <!-- Page Header -->
  <header class="page-header">
    <div>
      <h1>منتجات الطاقة الشمسية</h1>
      <p class="text-muted">
        اكتشف الحلول المناسبة لاحتياجاتك.
      </p>
    </div>

    <span class="product-count">
      {{ filteredProducts().length }} من {{ products().length }} منتجات
    </span>
  </header>

  <!-- Cart Feedback -->
  @if (cartFeedback(); as message) {
    <div class="cart-feedback" role="status" aria-live="polite">
      <span class="cart-feedback__icon" aria-hidden="true">✓</span>
      <span>{{ message }}</span>
    </div>
  }

  <!-- Search and Filters -->
  <app-products-filters
    [categories]="categories"
    [searchTerm]="searchTerm()"
    [selectedCategory]="selectedCategory()"
    [sortOption]="sortOption()"
    (searchTermChange)="searchTerm.set($event)"
    (categoryChange)="selectedCategory.set($event)"
    (sortChange)="sortOption.set($event)"
  />

  <!-- Products List -->
  <app-products-grid
    [products]="filteredProducts()"
    [categoryLabels]="categoryLabels"
    (addToCart)="addToCart($event)"
  />
</section>
