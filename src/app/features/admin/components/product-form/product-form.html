
<div class="form-backdrop" (click)="cancel.emit()">
  <section
    class="product-form-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="product-form-title"
    (click)="$event.stopPropagation()"
  >
    <header class="form-header">
      <div>
        <h3 id="product-form-title">
          {{ product() ? 'تعديل المنتج' : 'إضافة منتج جديد' }}
        </h3>

        <p class="text-muted">أدخل بيانات المنتج وتفاصيل المخزون.</p>
      </div>

      <app-button
        class="close-button"
        type="button"
        variant="secondary"
        ariaLabel="إغلاق"
        (clicked)="cancel.emit()"
      >
        ×
      </app-button>
    </header>

    <form #productForm="ngForm" (ngSubmit)="submitForm()">
      <div class="form-grid">
        <app-form-field
          class="form-field"
          label="اسم المنتج *"
          inputId="product-name"
          [control]="nameModel.control"
          [errors]="[{ key: 'required', message: 'يرجى إدخال اسم المنتج.' }]"
        >
          <input
            id="product-name"
            type="text"
            name="name"
            [(ngModel)]="formModel.name"
            #nameModel="ngModel"
            required
            maxlength="120"
            placeholder="مثلاً: لوح شمسي"
            [attr.aria-invalid]="nameModel.touched && nameModel.invalid"
            [attr.aria-describedby]="
              nameModel.touched && nameModel.invalid
                ? 'product-name-error'
                : null
            "
          />
        </app-form-field>

        <app-form-field
          class="form-field"
          label="التصنيف *"
          inputId="product-category"
          [control]="categoryModel.control"
          [errors]="[{ key: 'required', message: 'يرجى اختيار تصنيف.' }]"
        >
          <select
            id="product-category"
            name="category"
            [(ngModel)]="formModel.category"
            #categoryModel="ngModel"
            required
            [attr.aria-invalid]="categoryModel.touched && categoryModel.invalid"
            [attr.aria-describedby]="
              categoryModel.touched && categoryModel.invalid
                ? 'product-category-error'
                : null
            "
          >
            <option value="" disabled>اختر التصنيف</option>
            @for (category of categories(); track category.id) {
              <option [value]="category.id">{{ category.name }}</option>
            }
          </select>
        </app-form-field>

        <app-form-field
          class="form-field full-width"
          label="الوصف *"
          inputId="product-description"
          [control]="descriptionModel.control"
          [errors]="[
            { key: 'required', message: 'يرجى إدخال وصف المنتج.' },
            { key: 'maxlength', message: 'يجب ألا يتجاوز الوصف 1000 حرف.' }
          ]"
        >
          <textarea
            id="product-description"
            name="description"
            [(ngModel)]="formModel.description"
            #descriptionModel="ngModel"
            required
            maxlength="1000"
            rows="3"
            placeholder="وصف مختصر للمنتج"
            [attr.aria-invalid]="
              descriptionModel.touched && descriptionModel.invalid
            "
            [attr.aria-describedby]="
              descriptionModel.touched && descriptionModel.invalid
                ? 'product-description-error'
                : null
            "
          ></textarea>
        </app-form-field>

        <app-form-field
          class="form-field"
          label="السعر *"
          inputId="product-price"
          [control]="priceModel.control"
          [errors]="[
            { key: 'required', message: 'يرجى إدخال السعر.' },
            { key: 'min', message: 'يجب ألا يكون السعر أقل من صفر.' }
          ]"
        >
          <input
            id="product-price"
            type="number"
            name="price"
            [(ngModel)]="formModel.price"
            #priceModel="ngModel"
            required
            min="0"
            [attr.aria-invalid]="priceModel.touched && priceModel.invalid"
            [attr.aria-describedby]="
              priceModel.touched && priceModel.invalid
                ? 'product-price-error'
                : null
            "
          />
        </app-form-field>

        <app-form-field
          class="form-field"
          label="الاستطاعة بالواط *"
          inputId="product-power"
          [control]="powerModel.control"
          [errors]="[
            { key: 'required', message: 'يرجى إدخال الاستطاعة.' },
            { key: 'min', message: 'يجب ألا تقل الاستطاعة عن صفر.' }
          ]"
        >
          <input
            id="product-power"
            type="number"
            name="powerWatts"
            [(ngModel)]="formModel.powerWatts"
            #powerModel="ngModel"
            required
            min="0"
            [attr.aria-invalid]="powerModel.touched && powerModel.invalid"
            [attr.aria-describedby]="
              powerModel.touched && powerModel.invalid
                ? 'product-power-error'
                : null
            "
          />
        </app-form-field>

        <app-form-field
          class="form-field"
          label="كمية المخزون *"
          inputId="product-stock"
          [control]="stockModel.control"
          [errors]="[
            { key: 'required', message: 'يرجى إدخال كمية المخزون.' },
            { key: 'min', message: 'يجب ألا تقل الكمية عن صفر.' }
          ]"
        >
          <input
            id="product-stock"
            type="number"
            name="stock"
            [(ngModel)]="formModel.stock"
            #stockModel="ngModel"
            required
            min="0"
            step="1"
            [attr.aria-invalid]="stockModel.touched && stockModel.invalid"
            [attr.aria-describedby]="
              stockModel.touched && stockModel.invalid
                ? 'product-stock-error'
                : null
            "
          />
        </app-form-field>

        <app-form-field
          class="form-field"
          label="رابط الصورة *"
          inputId="product-image"
          [control]="imageModel.control"
          [errors]="[
            { key: 'required', message: 'يرجى إدخال رابط الصورة.' },
            { key: 'url', message: 'يرجى إدخال رابط صورة صالح.' }
          ]"
        >
          <input
            id="product-image"
            type="url"
            name="imageUrl"
            [(ngModel)]="formModel.imageUrl"
            #imageModel="ngModel"
            required
            placeholder="https://example.com/product.jpg"
            [attr.aria-invalid]="imageModel.touched && imageModel.invalid"
            [attr.aria-describedby]="
              imageModel.touched && imageModel.invalid
                ? 'product-image-error'
                : null
            "
          />
        </app-form-field>

        <app-form-field
          class="form-field full-width"
          label="حالة المنتج"
          inputId="product-active"
          [control]="activeModel.control"
        >
          <select
            id="product-active"
            name="isActive"
            [(ngModel)]="formModel.isActive"
            #activeModel="ngModel"
          >
            <option [ngValue]="true">فعّال</option>
            <option [ngValue]="false">غير فعّال</option>
          </select>
        </app-form-field>
      </div>

      <footer class="form-actions">
        <app-button
          type="button"
          variant="secondary"
          (clicked)="cancel.emit()"
        >
          إلغاء
        </app-button>

        <app-button
          type="submit"
          [disabled]="productForm.invalid"
        >
          {{ product() ? 'حفظ التعديلات' : 'إضافة المنتج' }}
        </app-button>
      </footer>
    </form>
  </section>
</div>
