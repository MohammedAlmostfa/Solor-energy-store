
<section class="categories-page" dir="rtl">

<app-admin-page-header
  eyebrow="إدارة المتجر"
  title="إدارة التصنيفات"
  description=" تنظيم تصنيفات المنتجات وإدارة ارتباطها بالمخزون."
/>
  <section class="stats-grid">
    <app-stat-card
      label="إجمالي التصنيفات"
      [value]="totalCategories()"
      icon="▧"
    />

    <app-stat-card
      label="المنتجات المصنفة"
      [value]="totalAssignedProducts()"
      icon="▦"
    />
  </section>

  <section class="category-layout">
    <article class="category-card category-editor">
      <h2>
        {{ editingId() ? 'تعديل التصنيف' : 'إضافة تصنيف جديد' }}
      </h2>

      <form (ngSubmit)="saveCategory()">
        <app-form-field
          label="اسم التصنيف"
          inputId="category-name"
          [control]="categoryNameControl"
          [errors]="[
            { key: 'required', message: 'يرجى إدخال اسم التصنيف.' },
            { key: 'maxlength', message: 'يجب ألا يتجاوز اسم التصنيف 80 حرفاً.' }
          ]"
        >
          <input
            id="category-name"
            type="text"
            maxlength="80"
            placeholder="مثال: منظمات شحن"
            [formControl]="categoryNameControl"
            (input)="clearErrorMessage()"
            [attr.aria-invalid]="categoryNameControl.touched && categoryNameControl.invalid"
            [attr.aria-describedby]="
              categoryNameControl.touched && categoryNameControl.invalid
                ? 'category-name-error'
                : null
            "
          />
        </app-form-field>

        @if (errorMessage()) {
          <p class="form-error" role="alert">
            {{ errorMessage() }}
          </p>
        }

        <div class="form-actions">
          <app-button type="submit" variant="primary">
            {{ editingId() ? 'حفظ التعديلات' : 'إضافة التصنيف' }}
          </app-button>

          @if (editingId()) {
            <app-button
              type="button"
              variant="secondary"
              (clicked)="cancelEdit()"
            >
              إلغاء
            </app-button>
          }
        </div>
      </form>
    </article>

    <article class="category-card category-list">
      <header class="list-header">
        <h2>التصنيفات</h2>

        <app-form-field
          label=""
          inputId="category-search"
          [control]="searchControl"
        >
          <input
            id="category-search"
            type="search"
            placeholder="ابحث عن تصنيف..."
            [formControl]="searchControl"
          />
        </app-form-field>
      </header>

      <app-data-table
        [columns]="tableColumns"
        [rows]="filteredCategories()"
        emptyMessage="لا توجد تصنيفات مطابقة للبحث."
      >
        <ng-template appDataTableCellTemplate="name" let-category>
          <strong>{{ category.name }}</strong>
        </ng-template>

        <ng-template appDataTableCellTemplate="productCount" let-category>
          <span class="product-count">{{ category.productCount }}</span>
        </ng-template>

        <ng-template appDataTableCellTemplate="actions" let-category>
          <div class="row-actions">
            <app-button
              type="button"
              variant="secondary"
              (clicked)="startEdit(category)"
            >
              تعديل
            </app-button>

            <app-button
              type="button"
              variant="danger"
              (clicked)="deleteCategory(category)"
            >
              حذف
            </app-button>
          </div>
        </ng-template>
      </app-data-table>
    </article>
  </section>
</section>
