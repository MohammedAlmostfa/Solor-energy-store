
<section class="dashboard-panel">
  <div class="panel-heading">
    <div>
      <h3>تنبيهات المخزون</h3>
      <p class="panel-description">
        المنتجات التي تحتاج إلى متابعة.
      </p>
    </div>

    <span class="panel-count">
      {{ lowStockProducts().length | number }} منتج
    </span>
  </div>

  <app-data-table
    [columns]="inventoryColumns"
    [rows]="lowStockProducts()"
    emptyMessage="لا توجد منتجات ضمن حد المخزون المنخفض."
  >
    <ng-template appDataTableCellTemplate="product" let-product>
      <div class="product-cell">
        <img
          [src]="product.imageUrl"
          [alt]="product.name"
          loading="lazy"
        />
        <span>{{ product.name }}</span>
      </div>
    </ng-template>

    <ng-template appDataTableCellTemplate="category" let-product>
      {{ categoryLabels[product.category] }}
    </ng-template>

    <ng-template appDataTableCellTemplate="price" let-product>
      {{ product.price | number }}
    </ng-template>

    <ng-template appDataTableCellTemplate="stock" let-product>
      <span
        class="stock-value"
        [class.low-stock]="product.stock > 0 && product.stock <= 5"
        [class.out-of-stock]="product.stock === 0"
      >
        {{ product.stock | number }}
      </span>
    </ng-template>

    <ng-template appDataTableCellTemplate="status">
      <span class="status-badge">
        مخزون منخفض
      </span>
    </ng-template>
  </app-data-table>
</section>
