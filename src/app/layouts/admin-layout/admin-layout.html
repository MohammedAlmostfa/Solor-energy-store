
<div class="admin-layout" dir="rtl">
  <aside class="admin-sidebar">
    <a class="admin-brand" routerLink="/admin">
      <span class="brand-icon" aria-hidden="true">☀</span>

      <span class="brand-info">
        <strong>Solar Store</strong>
        <small>إدارة المتجر</small>
      </span>
    </a>

    <div class="sidebar-section">
      <p class="sidebar-heading">القائمة الرئيسية</p>

      <nav class="admin-nav" aria-label="القائمة الرئيسية">
        @for (item of navigationItems; track item.route) {
          <a
            class="admin-nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
          >
            <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </div>

    <div class="sidebar-footer">
      <a class="back-to-store" routerLink="/">
        <span aria-hidden="true">←</span>
        <span>العودة إلى المتجر</span>
      </a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <div class="header-title">
        <span class="header-eyebrow">SOLAR STORE</span>
        <h1>لوحة الإدارة</h1>
      </div>

      <a class="store-shortcut" routerLink="/">
        <span aria-hidden="true">↗</span>
        عرض المتجر
      </a>
    </header>

    <main class="admin-content">
      <router-outlet />
    </main>
  </div>
</div>
